<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Site Status</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: center;
      width: 300px;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    #status {
      font-size: 1.4rem;
      margin: 20px 0;
    }

    .ready {
      color: #00ff9c;
      animation: pulse 2s infinite;
    }

    .not-ready {
      color: #ff4b5c;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #ffffff33;
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover:enabled {
      background-color: #ffffff55;
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Site Status Checker</h1>
    <div id="status">Checking...</div>
    <button id="coolBtn" disabled onclick="doSomethingCool()">🚀 Launch Magic</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const coolBtn = document.getElementById('coolBtn');

    function setStatus(ok) {
      if (ok) {
        statusEl.textContent = '✅ Site is Operational';
        statusEl.className = 'ready';
        coolBtn.disabled = false;
      } else {
        statusEl.textContent = '❌ Site is Down';
        statusEl.className = 'not-ready';
        coolBtn.disabled = true;
      }
    }

    function checkOllamaViaScript() {
      const script = document.createElement('script');
      script.src = 'http://127.0.0.1:11434/';
      script.onload = () => setStatus(true);
      script.onerror = () => setStatus(false);
      document.body.appendChild(script);
    }

    function doSomethingCool() {
      alert("🎉 Boom! You're connected and something cool just happened!");
    }

    window.onload = checkOllamaViaScript;
  </script>
</body>
</html>
